<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Interfaz Web</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        /* Menú superior */
        nav {
            display: flex;
            justify-content: center;
            background-color: #2f7dbd;
        }

        nav a {
            padding: 15px 30px;
            color: white;
            text-decoration: none;
            border-right: 1px solid #1d5f91;
            font-weight: bold;
        }

        nav a:hover {
            background-color: #1d5f91;
        }

        /* Contenedor principal */
        .container {
            display: flex;
            justify-content: center;
            margin-top: 60px;
        }

        /* Caja del formulario */
        .card {
            background: linear-gradient(to right, #5fd0d8, #6fe0b5);
            border-radius: 25px;
            padding: 40px;
            width: 600px;
            border: 8px solid #1d5f91;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        /* Formulario */
        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        label {
            width: 120px;
            font-weight: bold;
            color: #003c64;
        }

        input {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
        }

        .btn {
            margin-left: 20px;
            padding: 20px;
            background-color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            color: #003c64;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #e0e0e0;
        }
    </style>

</head>

<body>

    <!-- Menú -->
    <nav>
        <nav>
    <a href="#inicio">Inicio</a>
    <a href="#conocenos">Conócenos</a>
    <a href="#productos">Productos</a>
    <a href="#registro">Registro</a>
    <a href="#contacto">Contacto</a>
</nav>
    </nav>

    <!-- Contenido -->
    <div class="container">
        <div class="card">

            <div class="form-group">
                <label>Web:</label>
                <input type="text" value="https://accounts.google.com/SignUp">
                <button class="btn">Buscar</button>
            </div>

            <div class="form-group">
                <label>Nombre:</label>
                <input type="text" value="Juan">
            </div>

            <div class="form-group">
                <label>Apellido:</label>
                <input type="text" value="Pablo">
            </div>

        </div>
    </div>

</body>
</html>
